name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # 今日の日付を JST で判定することを、ランナーのタイムゾーンを変えて確かめる
  test1:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: [UTC, Asia/Tokyo, Pacific/Kiritimati, Pacific/Pago_Pago]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm install @holiday-jp/holiday_jp

      - uses: actions/github-script@v9
        id: is-holiday-expected
        with:
          script: |
            const holiday_jp = require(`${process.env.GITHUB_WORKSPACE}/node_modules/@holiday-jp/holiday_jp`)
            const [y, m, d] = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo' }).format(new Date()).split('-').map(Number);
            core.setOutput('holiday', holiday_jp.isHoliday(new Date(y, m - 1, d)));
      - uses: ./
        id: is-holiday-actual
      - run: |
          if [ "${{ steps.is-holiday-expected.outputs.holiday == steps.is-holiday-actual.outputs.is-holiday }}" == true ]; then
            exit 0
          else
            exit 1
          fi

  test2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: ./
        id: is-holiday-actual
        with:
          date: '2024/2/12'

      - run: |
          if [ "${{ steps.is-holiday-actual.outputs.is-holiday }}" == true ]; then
            exit 0
          else
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: yarn install

      - run: yarn biome format ./src/index.ts

  check-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: yarn install

      - run: yarn build

      - name: Compare the expected and actual dist/ directories
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build.  See status below:"
            exit 1
          fi

  merge:
    if: github.actor == 'dependabot[bot]' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    needs: [test1, test2, lint, check-build]
    permissions:
      pull-requests: write
      contents: write
    steps:
      - run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
